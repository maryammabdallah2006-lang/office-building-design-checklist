<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F1EC">
<title>HUMAN — Workplace Design Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#F3F1EC;--ink:#171717;--sec:#6E6B65;
 --line:#DCD8CF;--line2:#B4AFA4;
 --acc:#2B4A63; /* single accent: deep architectural blue */
 --sans:'Archivo','IBM Plex Sans Arabic',system-ui,sans-serif;
 --mono:'IBM Plex Mono','IBM Plex Sans Arabic',monospace;
 --ar:'IBM Plex Sans Arabic','Archivo',system-ui,sans-serif;
 --gridA:rgba(23,23,23,.03);--gridB:rgba(23,23,23,.055);--hh:99px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:clip}
/* faint architectural grid: 10px minor + 50px major */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
 background-image:linear-gradient(var(--gridA) 1px,transparent 1px),linear-gradient(90deg,var(--gridA) 1px,transparent 1px),
 linear-gradient(var(--gridB) 1px,transparent 1px),linear-gradient(90deg,var(--gridB) 1px,transparent 1px);
 background-size:10px 10px,10px 10px,50px 50px,50px 50px}
::selection{background:var(--acc);color:#F3F1EC}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:start}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
svg{display:block}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.mir{display:inline-block}
[dir=rtl] .mir{transform:scaleX(-1)}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:50;background:rgba(243,241,236,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--ink)}
.wrap{padding-inline:18px}
.hdrTop{display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px}
.brand{display:inline-flex;align-items:center;gap:9px;font:700 13px/1 var(--sans);letter-spacing:.24em;transition:opacity .2s}
.brand:hover{opacity:.65}
.bsq{width:7px;height:7px;background:var(--acc);flex:none}
.hstep{display:none}
.hstep b{font-weight:500;color:var(--ink)}
.hbtns{display:flex;align-items:center;gap:10px}
.tbtn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;min-width:44px;padding:0 12px;border:1px solid var(--ink);font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;transition:.2s}
.tbtn:hover{background:var(--ink);color:var(--bg)}
.ic{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.3;flex:none}
.lang{display:flex;border:1px solid var(--ink)}
.lbtn{min-height:44px;min-width:44px;padding:0 10px;text-align:center;font:500 10px var(--mono);letter-spacing:.1em;transition:.2s}
.lbtn+.lbtn{border-inline-start:1px solid var(--ink)}
.lbtn[aria-pressed=true]{background:var(--ink);color:var(--bg)}
/* progress strip: 01 ─○─ 14 + checked count */
.strip{display:flex;align-items:center;gap:10px;height:42px;border-top:1px solid var(--line)}
.sEnd{font:500 10px var(--mono);color:var(--sec)}
.cnt{font:400 10px var(--mono);color:var(--sec);white-space:nowrap}
.cnt b{font-weight:500;color:var(--ink)}
.track{position:relative;flex:1;min-width:52px;height:100%}
.track::before{content:"";position:absolute;inset-inline:0;top:50%;height:1px;background:var(--line2)}
.tk{position:absolute;top:50%;width:1px;height:7px;background:var(--line2);transform:translate(-50%,-50%);transition:background .25s,height .25s}
[dir=rtl] .tk{transform:translate(50%,-50%)}
.tk.done{background:var(--acc);height:9px}
.tFill{position:absolute;inset-inline-start:0;top:50%;height:2px;background:var(--acc);transform:translateY(-50%);transition:width .5s cubic-bezier(.4,0,.2,1)}
.tNode{position:absolute;top:50%;width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px var(--bg);transform:translate(-50%,-50%);transition:left .5s cubic-bezier(.4,0,.2,1)}
[dir=rtl] .tNode{transform:translate(50%,-50%)}
/* tablet step chips */
.chips{display:none}
@media (min-width:768px){.chips{display:flex;gap:8px;padding:4px 0 12px;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line)}.chips::-webkit-scrollbar{display:none}}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 13px;border:1px solid var(--line2);font:500 12px/1 var(--sans);color:var(--sec);white-space:nowrap;transition:.2s}
.chip .cn{font:500 10px var(--mono);color:var(--sec)}
.chip .ct{padding-top:1px}
.chip .ck{color:var(--acc);font-size:11px}
.chip.done{border-color:var(--acc)}.chip.done .cn{color:var(--acc)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.on .cn{color:var(--bg)}.chip.on .ck{color:var(--bg)}

/* ---------- shell ---------- */
.shell{flex:1;display:grid;grid-template-columns:1fr;align-items:start}
.main{min-width:0;padding:22px 18px calc(96px + env(safe-area-inset-bottom,0px))}
.inner{max-width:740px;margin:0 auto}
.inner.wide{max-width:860px}
.sheet{animation:sIn .34s ease both}
@keyframes sIn{from{opacity:0;transform:translateY(12px)}}
.railL,.railR{display:none}

/* ---------- cover ---------- */
.coverGrid{display:grid;gap:30px;padding-top:clamp(24px,5vh,52px)}
.coverT{margin:10px 0 0;font:600 clamp(2.7rem,11.5vw,4.6rem)/0.98 var(--sans);letter-spacing:-.02em;text-transform:uppercase}
.covSub{margin:18px 0 0;max-width:44ch;color:var(--sec)}
.planWrap{position:relative;max-width:520px;border:1px solid var(--line2);padding:22px 14px 12px}
.cm{position:absolute;font:400 13px/1 var(--mono);color:var(--line2);pointer-events:none}
.cm.a{top:-7px;left:-6px}.cm.b{top:-7px;right:-6px}.cm.c{bottom:-7px;left:-6px}.cm.d{bottom:-7px;right:-6px}
.plan{width:100%;height:auto;color:var(--ink)}
.plan path,.plan rect,.plan circle{fill:none;stroke:currentColor;stroke-width:1}
.plan .th{stroke-width:2}
.plan .ac{stroke:var(--acc)}
.plan .fsq{fill:currentColor;stroke:none}
.plan text{fill:currentColor;stroke:none;font-family:var(--mono)}
.plan .lbl{font-size:9px;font-weight:600;letter-spacing:2.5px;text-anchor:middle}
.plan .lblS{font-size:6.5px;font-weight:500;letter-spacing:1.5px;text-anchor:middle;opacity:.55}
.plan .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.2s cubic-bezier(.45,0,.2,1) forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.plan .fd{opacity:0;animation:fIn .5s ease forwards}
@keyframes fIn{to{opacity:1}}
.planCap{display:flex;justify-content:space-between;gap:10px;margin-top:14px;padding-top:9px;border-top:1px solid var(--line);font:500 8.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--sec)}
.covRow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.covSteps{font:600 10.5px var(--sans);letter-spacing:.18em;text-transform:uppercase}
.covCount{font:400 10px var(--mono);color:var(--sec)}
.covCount b{font-weight:500;color:var(--ink)}
.covTrack{height:16px;margin-top:12px}
.cMeta{margin-top:6px}
.titleblock{display:flex;justify-content:space-between;gap:10px;margin-top:36px;padding-top:10px;border-top:1px solid var(--ink);font:500 8.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--sec)}

/* ---------- step ---------- */
.kLab{margin:28px 0 8px;font:500 10px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--sec)}
.kLab b{font-weight:500;color:var(--ink)}
.numRow{display:flex;align-items:center;gap:18px}
.stepNum{font:300 clamp(4rem,15vw,7rem)/0.85 var(--sans);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.numRule{position:relative;flex:1;height:1px;background:var(--line2)}
.numRule::before{content:"";position:absolute;inset-inline-start:0;top:-3px;width:7px;height:7px;background:var(--acc)}
.stepT{margin:12px 0 0;font:600 clamp(1.7rem,7vw,2.7rem)/1.08 var(--sans);letter-spacing:0;text-transform:uppercase}
.lead{margin:15px 0 0;max-width:56ch;color:var(--sec)}
/* design-logic diagram */
.lgcBox{margin:26px 0 0;border:1px solid var(--line2);padding:16px 16px 8px}
.lgc{list-style:none;margin:0;padding:0}
.lgc li{position:relative;display:flex;align-items:center;gap:11px;padding:6px 0;opacity:0;animation:ndIn .4s ease both}
@keyframes ndIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.lgc li::before{content:"";width:7px;height:7px;flex:none;background:var(--bg);border:1.2px solid var(--ink)}
.lgc li:last-child::before{background:var(--acc);border-color:var(--acc)}
.lgc li:not(:last-child)::after{content:"";position:absolute;inset-inline-start:3px;top:calc(50% + 5px);bottom:calc(-50% + 5px);width:1px;background:var(--line2)}
.lgc i{font:500 9px var(--mono);font-style:normal;color:var(--acc)}
.lgc b{font:600 11px/1.25 var(--sans);letter-spacing:.1em;text-transform:uppercase}
/* checklist — architectural specification list */
.cl{list-style:none;margin:30px 0 0;padding:0;border-top:2px solid var(--ink)}
.it{position:relative;display:grid;grid-template-columns:30px minmax(0,1fr) 24px;column-gap:12px;padding:15px 0 16px;border-bottom:1px solid var(--line);cursor:pointer}
.it input{position:absolute;opacity:0;width:0;height:0}
.ino{grid-column:1;grid-row:1;align-self:center;font:500 10.5px var(--mono);color:var(--sec);transition:color .25s}
.itRule{grid-column:2;grid-row:1;align-self:center;height:1px;background:var(--line2);transition:background .25s}
.ibox{grid-column:3;grid-row:1;justify-self:end;align-self:center;width:21px;height:21px;border:1.5px solid var(--ink);background:var(--bg);display:grid;place-items:center;transition:border-color .2s}
.ibox svg{width:13px;height:13px;fill:none;stroke:var(--acc);stroke-width:2.2;stroke-linecap:square}
.ibox svg path{stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .3s ease .05s}
.itx{grid-column:1/-1;grid-row:2;margin-top:9px;font-size:15px;line-height:1.55;max-width:62ch}
.it:hover .ibox{border-color:var(--acc)}
.it input:focus-visible~.ibox{outline:2px solid var(--acc);outline-offset:3px}
.it.on .ino{color:var(--acc)}
.it.on .itRule{background:var(--acc)}
.it.on .ibox{border-color:var(--acc)}
.it.on .ibox svg path{stroke-dashoffset:0}
/* cross-reference to dimensions sheet */
.ref{margin-top:20px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px dashed var(--sec);padding:15px 16px;font:600 10px var(--sans);letter-spacing:.15em;text-transform:uppercase;color:var(--sec);transition:.2s}
.ref:hover{color:var(--acc);border-color:var(--acc)}
/* output */
.out{position:relative;margin:26px 0 0;border:1px solid var(--line2);padding:15px 16px 17px}
.out::before{content:"";position:absolute;top:-4.5px;inset-inline-start:14px;width:8px;height:8px;background:var(--acc)}
.out .lab{margin-bottom:7px}
.lab{margin:0 0 10px;font:600 10px/1.4 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--sec)}
.outT{margin:0;font:500 14px/1.55 var(--sans)}
/* inline prev/next (desktop) */
.navbtns{display:none;justify-content:space-between;gap:14px;margin-top:44px;padding-top:18px;border-top:1px solid var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 22px;border:1px solid var(--ink);font:600 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;transition:background .2s,color .2s,border-color .2s}
.btn:not(.pri):hover{background:var(--ink);color:var(--bg)}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.pri:hover{background:var(--acc);border-color:var(--acc)}
.btn.big{width:100%;justify-content:space-between;min-height:58px;padding:0 20px;font-size:13px;margin-top:24px}

/* ---------- completion ---------- */
.doneH{margin:10px 0 0;font:600 clamp(2.5rem,9vw,4.4rem)/1.02 var(--sans);letter-spacing:-.015em;text-transform:uppercase}
.doneCount{margin:20px 0 0;font:500 12px var(--mono);letter-spacing:.2em}
.doneCount b{font-weight:500;color:var(--acc)}
.doneBar{width:min(420px,100%);height:2px;background:var(--acc);margin:12px 0 26px}
.hch{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0;font:600 11.5px/1.5 var(--sans);letter-spacing:.14em;text-transform:uppercase}
.hch .hsep{color:var(--acc);font-family:var(--mono);font-weight:400}
.doneP{margin:22px 0 0;max-width:48ch;color:var(--sec)}
.doneBtns{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}

/* ---------- bottom nav (mobile / tablet) ---------- */
.bnav{position:fixed;inset-inline:0;bottom:0;z-index:45;display:flex;border-top:1px solid var(--ink);background:rgba(243,241,236,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding-bottom:env(safe-area-inset-bottom)}
.bb{flex:1;display:flex;align-items:center;justify-content:center;gap:9px;min-height:62px;font:600 11.5px/1 var(--sans);letter-spacing:.15em;text-transform:uppercase;transition:background .2s}
.bb:not(.pri):active{background:rgba(23,23,23,.06)}
.bb.pri{background:var(--ink);color:var(--bg)}
.bb.pri:hover{background:var(--acc)}

/* ---------- shared drawer behaviour ---------- */
.veil{position:fixed;inset:0;z-index:60;background:rgba(23,23,23,.35);opacity:0;pointer-events:none;transition:opacity .25s}
body.dimsOpen,body.menuOpen{overflow:hidden}
body.dimsOpen .veil,body.menuOpen .veil{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:61;top:0;bottom:0;inset-inline-end:0;width:min(400px,100%);background:var(--bg);border-inline-start:1px solid var(--ink);transform:translateX(calc(100% + 4px));transition:transform .32s cubic-bezier(.32,0,.2,1);overflow-y:auto;overscroll-behavior:contain}
[dir=rtl] .drawer{transform:translateX(calc(-100% - 4px))}
body.dimsOpen .drawer,body.menuOpen .drawer{transform:translateX(0)}
.dHead{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;background:var(--bg);border-bottom:1px solid var(--ink)}
.dT{margin:0;font:600 12px/1.3 var(--sans);letter-spacing:.16em;text-transform:uppercase}
.dN{margin:4px 0 0;font:400 9px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--sec)}
.dClose{width:44px;height:44px;flex:none;display:grid;place-items:center;border:1px solid var(--ink);font:300 20px/1 var(--sans);transition:.2s}
.dClose:hover{background:var(--ink);color:var(--bg)}
.dBody{padding:4px 20px 30px}
.dm{padding:18px 0 16px;border-bottom:1px solid var(--line)}
.dv{display:inline-block;direction:ltr;unicode-bidi:isolate;font:500 19px var(--mono);letter-spacing:-.01em}
.dline{display:block;height:9px;margin:12px 0 9px;border-inline:1px solid var(--ink);position:relative}
.dline::after{content:"";position:absolute;inset-inline:0;top:50%;border-top:1px solid var(--ink)}
.dl2{font:500 9px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--sec)}

/* ---------- shared rail bits (menu reuses these) ---------- */
.rRule{height:1px;background:var(--line2);margin:16px 0;border:0}
.dimsLink{display:flex;align-items:center;gap:9px;width:100%;padding:9px 0;font:600 10.5px/1.4 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--sec);transition:color .2s}
.dimsLink:hover{color:var(--acc)}

/* ---------- navigation menu drawer ---------- */
.mBody{padding:10px 20px 36px}
.mBody .lab{margin:16px 0 10px}
.mv{display:grid;grid-template-columns:20px minmax(0,1fr);column-gap:10px;width:100%;min-height:54px;padding:12px;border:1px solid var(--line2);text-align:start;transition:border-color .2s}
.mv+.mv{margin-top:8px}
.mv .mdot{width:9px;height:9px;margin-top:4px;border:1.2px solid var(--sec);transition:.2s}
.mv .mtx{font:600 12.5px/1.3 var(--sans);letter-spacing:.08em;text-transform:uppercase}
.mv .msub{grid-column:2;margin-top:4px;font:400 11.5px/1.5 var(--sans);color:var(--sec)}
.mv:hover{border-color:var(--ink)}
.mv[aria-checked=true]{border-color:var(--ink)}
.mv[aria-checked=true] .mdot{background:var(--acc);border-color:var(--acc)}
.mSteps{list-style:none;margin:0;padding:0}
.ms{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:8px 2px;border-bottom:1px solid var(--line);text-align:start}
.ms .mn{font:500 10.5px var(--mono);color:var(--sec);width:20px;flex:none;transition:color .2s}
.ms .mt{flex:1;font:500 13.5px/1.4 var(--sans);color:var(--ink);letter-spacing:.02em}
.ms .mb{font:400 10px var(--mono);min-width:34px;text-align:end;color:var(--sec)}
.ms .mb b{font-weight:400}
.ms:hover .mt{font-weight:600}
.ms.on .mn{color:var(--acc)}
.ms.on .mt{font-weight:600}
.ms.done .mn{color:var(--acc)}
.ms.done .mb{color:var(--acc)}

/* ---------- all checklist sheet ---------- */
.allview .stepT{margin-top:6px}
.allTop{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:26px}
.allCnt{font:400 11px var(--mono);color:var(--sec)}
.allCnt b{font-weight:500;color:var(--ink)}
.alstep{padding-top:48px;scroll-margin-top:118px}
.alHead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:16px;align-items:start}
.alNum{font:300 clamp(2.4rem,7vw,3.2rem)/0.9 var(--sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.alT{margin:4px 0 0;font:600 clamp(1.15rem,3.6vw,1.5rem)/1.18 var(--sans);text-transform:uppercase}
.alChain{margin:10px 0 0;font:500 9.5px/1.9 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--sec)}
.alChain .as{color:var(--acc);padding:0 3px}
.alD{margin:8px 0 0;font-size:13.5px;line-height:1.6;color:var(--sec);max-width:62ch}
.alC{padding-top:8px;font:400 10.5px var(--mono);color:var(--sec);white-space:nowrap}
.alC b{font-weight:500;color:var(--ink)}
.alC.done{color:var(--acc)}
.alC.done b{color:var(--acc)}
.allview .cl{margin-top:16px}
.allview .it{padding:12px 0 13px}
.allview .itx{font-size:14px;line-height:1.5}
.allOut{margin:12px 0 0;font:400 11px/1.7 var(--mono);color:var(--sec)}
.allOut b{font-weight:500;color:var(--ink);letter-spacing:.12em;text-transform:uppercase}
.allview .titleblock{margin-top:56px}
.allDone{margin-top:44px}
.allDone .btn{width:100%;justify-content:space-between}

/* ---------- desktop: drawing board ---------- */
@media (min-width:768px){
 .wrap{padding-inline:32px}
 .main{padding:34px 32px calc(112px + env(safe-area-inset-bottom,0px))}
 .stepNum{font-size:clamp(4.5rem,9vw,7rem)}
}
@media (min-width:1100px){
 .wrap{padding-inline:24px}
 .shell{grid-template-columns:240px minmax(0,1fr) 316px}
 .hstep{display:block;flex:1;text-align:center;padding:0 12px;font:500 10px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .railL{display:block;position:sticky;top:99px;height:calc(100vh - 99px);overflow-y:auto;padding:26px 24px 30px;border-inline-end:1px solid var(--line2)}
 .railR{display:block;position:sticky;top:99px;height:calc(100vh - 99px);overflow-y:auto;padding:26px 24px 30px;border-inline-start:1px solid var(--line2)}
 .chips{display:none}
 .bnav{display:none}
 .navbtns{display:flex}
 .lgcBox,.main .out{display:none}
 .main{padding:40px 48px 72px}
 .railSub{margin:10px 0 0;font:500 9px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--sec)}
 .rol{list-style:none;margin:2px 0 0;padding:0}
 .ni{display:flex;align-items:center;gap:10px;width:100%;padding:8px 0;color:var(--sec);font-size:12.5px;transition:color .2s}
 .nm{width:8px;height:8px;flex:none;border:1px solid var(--sec);transition:.2s}

 if(st.view!=='cover'){
  const f=isStep?st.step/(N-1)*100:isAll?pct():st.view==='done'?100:0;

 +'<div class="doneBar" aria-hidden="true"></div>'
 +'<p class="hch">'+ch.map(x=>'<b>'+x+'</b>').join('<span class="hsep mir" aria-hidden="true">→</span>')+'</p>'
 +'<p class="doneP">'+$L(UI.doneT)+'</p>'
 +'<div class="doneBtns"><button class="btn pri" data-again>'+$L(UI.again)+'</button><button class="btn" data-reset>'+$L(UI.reset)+'</button></div>'
 +'</div></div>';
}

function RailL(){
 return '<aside class="railL"><button class="brand" data-home>HUMAN<span class="bsq" aria-hidden="true"></span></button>'
 +'<p class="railSub mono">'+$L(UI.railSub)+'</p><div class="rRule"></div>'
 +'<p class="lab">'+$L(UI.index)+'</p>'
 +'<nav aria-label="'+$L(UI.navLabel)+'"><ol class="rol">'+STEPS.map((s,i)=>{
  const done=stepCount(i)===s.i.length;
  return '<li><button class="ni'+(st.view==='step'&&st.step===i?' on':'')+(done?' done':'')+'" data-go="'+i+'"'+(st.view==='step'&&st.step===i?' aria-current="step"':'')+'>'
  +'<span class="nm" aria-hidden="true"></span><span class="nn">'+pad(i+1)+'</span><span class="ntx">'+$L(s.s)+'</span>'
  +'<span class="nbd" data-badge="'+i+'">'+bdg(i)+'</span></button></li>';
 }).join('')+'</ol></nav>'
 +'<div class="rRule"></div><button class="dimsLink" data-dims>'+ICON.dim+'<span>'+$L(UI.dimsT)+'</span></button>'
 +'<div class="rRule"></div>'
 +'<div class="rfRow"><span class="lab">'+$L(UI.checkedL)+'</span><span class="gCount mono" id="gCount"><b class="ltr">'+st.checked.size+' / '+TOTAL+'</b></span></div>'
 +'<div class="gBar"><i id="gFill" style="width:'+pct()+'%"></i></div></aside>';
}

function RailR(){
 const s=st.view==='step'?STEPS[st.step]:null;
 return '<aside class="railR">'
 +(s?'<section><p class="lab">'+$L(s.final?UI.finalTest:UI.logic)+'</p>'+chainV(s.l)+'</section><div class="rRule"></div>'
 +'<section><p class="lab">'+$L(UI.output)+'</p><p class="outT">'+$L(s.o)+'</p></section><div class="rRule"></div>':'')
 +'<section><p class="lab">'+$L(UI.dimsT)+'</p>'
 +DIMS.slice(0,3).map(d=>'<div class="rdm"><span class="dvS mono">'+$L(d)[0]+'</span><span class="dl2 mono">'+$L(d)[1]+'</span></div>').join('')
 +'<button class="dimsLink" data-dims><span>'+$L(UI.openSheet)+'</span>'+mir('→')+'</button></section></aside>';
}

const BNav=()=>'<footer class="bnav"><button class="bb" data-prev>'+mir('←')+'<span>'+$L(UI.prev)+'</span></button>'
 +'<button class="bb pri" data-next'+(st.step===N-1?' style="visibility:hidden"':'')+'><span>'+$L(UI.next)+'</span>'+mir('→')+'</button></footer>';

function Drawer(){
 return '<aside class="drawer ddrawer" role="dialog" aria-modal="true" aria-label="'+$L(UI.dimsT)+'">'
 +'<div class="dHead"><div><p class="dT">'+$L(UI.dimsT)+'</p><p class="dN mono">'+$L(UI.dimsNote)+'</p></div>'
 +'<button class="dClose" data-close aria-label="'+$L(UI.close)+'">×</button></div>'
 +'<div class="dBody">'+DIMS.map((d,i)=>'<div class="dm"><span class="dv mono">'+$L(d)[0]+'</span><span class="dline" style="width:'+DLW[i]+'%"></span><span class="dl2 mono">'+$L(d)[1]+'</span></div>').join('')+'</div></aside>';
}

/* ---- NEW: navigation menu drawer (view switch + step index) ---- */
function Menu(){
 const stepActive=st.view!=='all';
 return '<aside class="drawer mdrawer" role="dialog" aria-modal="true" aria-label="'+$L(UI.navTitle)+'">'
 +'<div class="dHead"><div><p class="dT">'+$L(UI.navTitle)+'</p><p class="dN mono">HUMAN — '+$L(UI.railSub)+'</p></div>'
 +'<button class="dClose" data-close aria-label="'+$L(UI.close)+'">×</button></div>'
 +'<div class="mBody">'
 +'<p class="lab">'+$L(UI.viewL)+'</p>'
 +'<div class="mViews" role="radiogroup" aria-label="'+$L(UI.viewL)+'">'
  +'<button class="mv" role="radio" aria-checked="'+stepActive+'" data-viewmode="step"><span class="mdot" aria-hidden="true"></span><span class="mtx">'+$L(UI.mv1)+'</span><span class="msub">'+$L(UI.mv1s)+'</span></button>'
  +'<button class="mv" role="radio" aria-checked="'+(!stepActive)+'" data-viewmode="all"><span class="mdot" aria-hidden="true"></span><span class="mtx">'+$L(UI.mv2)+'</span><span class="msub">'+$L(UI.mv2s)+'</span></button>'
 +'</div>'
 +'<div class="rRule"></div>'
 +'<p class="lab">'+$L(UI.stepsL)+'</p>'
 +'<ol class="mSteps">'+STEPS.map((s,i)=>{
  const cur=st.view==='step'&&st.step===i;
  return '<li><button class="ms'+(cur?' on':'')+'" data-go="'+i+'" data-badge="'+i+'">'
   +'<span class="mn mono">'+pad(i+1)+'</span><span class="mt">'+$L(s.s)+'</span>'
   +'<span class="mb mono">'+bdg(i)+'</span></button></li>';
 }).join('')+'</ol>'
 +'<div class="rRule"></div>'
 +'<button class="dimsLink" data-dims>'+ICON.dim+'<span>'+$L(UI.dimsT)+'</span></button>'
 +'</div></aside>';
}

/* ============ RENDER / UPDATE ============ */
const app=document.getElementById('app');
function render(){
 const de=document.documentElement;
 de.lang=st.lang?'ar':'en';de.dir=st.lang?'rtl':'ltr';
 document.body.setAttribute('lang',de.lang);
 document.title='HUMAN — '+$L(UI.docTitle);
 const body=st.view==='cover'?Cover():st.view==='done'?Done():st.view==='all'?AllView():Step(st.step);
 app.innerHTML=Header()+'<div class="shell">'+RailL()+'<main class="main"><div class="inner'+(st.view==='all'?' wide':'')+'">'+body+'</div></main>'+RailR()+'</div>'
  +(st.view==='step'?BNav():'')+'<div class="veil" data-close></div>'+Drawer()+Menu();
 document.body.classList.remove('dimsOpen');
 document.body.classList.remove('menuOpen');
 /* animate progress line from its previous position */
 const tf=app.querySelector('.tFill'),tn=app.querySelector('.tNode');
 const tgt=st.view==='done'?100:st.view==='all'?pct():st.view==='step'?st.step/(N-1)*100:pct();
 if(tf){
  tf.style.width=(lastFrac)+'%';if(tn)tn.style.left=P(lastFrac)+'%';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{tf.style.width=tgt+'%';if(tn)tn.style.left=P(tgt)+'%';}));
 }
 lastFrac=tgt;
 const chip=app.querySelector('.chip.on');
 if(chip&&matchMedia('(min-width:768px)').matches)chip.scrollIntoView({inline:'center',block:'nearest'});
 setupSpy();
}
function update(){
 const mc=document.getElementById('metaChecked');
 if(mc)mc.innerHTML=st.view==='step'
  ?'<b class="ltr">'+stepCount(st.step)+' / '+STEPS[st.step].i.length+'</b> '+$L(UI.checkedL)
  :'<b class="ltr">'+st.checked.size+' / '+TOTAL+'</b> '+$L(UI.checkedL);
 if(st.view==='all'){
  const tf=app.querySelector('.tFill'),tn=app.querySelector('.tNode');
  if(tf)tf.style.width=pct()+'%';if(tn)tn.style.left=P(pct())+'%';
  const ac=document.getElementById('allCount');
  if(ac)ac.innerHTML='<b class="ltr">'+st.checked.size+' / '+TOTAL+'</b>&nbsp;'+$L(UI.checkedL);
 }
 app.querySelectorAll('.tk[data-tk]').forEach(t=>{const i=+t.dataset.tk;t.classList.toggle('done',stepCount(i)===STEPS[i].i.length)});
 document.querySelectorAll('[data-badge]').forEach(b=>{
  const i=+b.dataset.badge;b.innerHTML=bdg(i);
  const p=b.closest('.ni, .chip, .ms');if(p)p.classList.toggle('done',stepCount(i)===STEPS[i].i.length);
 });
 document.querySelectorAll('[data-acount]').forEach(el=>{
  const i=+el.dataset.acount;el.innerHTML=acB(i);
  el.classList.toggle('done',stepCount(i)===STEPS[i].i.length);
 });
 const ad=app.querySelector('.allDone');if(ad)ad.hidden=st.checked.size!==TOTAL;
 const gc=document.getElementById('gCount');if(gc)gc.innerHTML='<b class="ltr">'+st.checked.size+' / '+TOTAL+'</b>';
 const gf=document.getElementById('gFill');if(gf)gf.style.width=pct()+'%';
}
function go(view,step){st.view=view;if(step!==undefined)st.step=step;render();window.scrollTo(0,0);}
function scrollToSec(i){
 const el=document.getElementById('alstep-'+i);
 if(!el){go('step',i);return}
 const beh=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
 requestAnimationFrame(()=>el.scrollIntoView({behavior:beh,block:'start'}));
}
/* scroll-spy: highlights the section in view (rail, chips, menu) while in All Checklist */
function setupSpy(){
 if(spy){spy.disconnect();spy=null}
 if(st.view!=='all'||!('IntersectionObserver' in window))return;
 spy=new IntersectionObserver(es=>{
  es.forEach(e=>{if(e.isIntersecting)setCurSec(+e.target.dataset.sec)});
 },{rootMargin:'-110px 0px -62% 0px'});
 app.querySelectorAll('.alstep').forEach(s=>spy.observe(s));
}
function setCurSec(i){
 app.querySelectorAll('.ni[data-go]').forEach(n=>n.classList.toggle('on',+n.dataset.go===i));
 app.querySelectorAll('.chip[data-go]').forEach(n=>n.classList.toggle('on',+n.dataset.go===i));
 app.querySelectorAll('.ms[data-go]').forEach(n=>n.classList.toggle('on',+n.dataset.go===i));
}
const openDims=()=>{document.body.classList.add('dimsOpen');const c=app.querySelector('.ddrawer .dClose');if(c)c.focus();};
const closeDims=()=>document.body.classList.remove('dimsOpen');
const openMenu=()=>{document.body.classList.add('menuOpen');const c=app.querySelector('.mdrawer .dClose');if(c)c.focus();};
const closeMenu=()=>document.body.classList.remove('menuOpen');
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDims();closeMenu();}});

app.addEventListener('click',e=>{
 const b=e.target.closest('button,[data-close]');if(!b)return;
 if(b.dataset.lang!==undefined){st.lang=+b.dataset.lang;render();return}
 if(b.dataset.menu!==undefined){openMenu();return}
 if(b.dataset.close!==undefined){closeDims();closeMenu();return}
 if(b.dataset.viewmode!==undefined){
  const m=b.dataset.viewmode;closeMenu();
  if(m==='all'&&st.view!=='all'){st.view='all';render();window.scrollTo(0,0)}
  else if(m==='step'&&(st.view==='all'||st.view==='done')){go('step',st.step)}
  return}
 if(b.dataset.backstep!==undefined){go('step',st.step);return}
 if(b.dataset.donedir!==undefined){go('done');return}
 if(b.dataset.dims!==undefined){closeMenu();openDims();return}
 if(b.dataset.go!==undefined){
  if(st.view==='all'){closeMenu();scrollToSec(+b.dataset.go)}
  else{closeMenu();go('step',+b.dataset.go)}
  return}
 if(b.dataset.home!==undefined){go('cover');return}
 if(b.dataset.start!==undefined){go('step',0);return}
 if(b.dataset.prev!==undefined){st.step===0?go('cover'):go('step',st.step-1);return}
 if(b.dataset.next!==undefined){go('step',Math.min(N-1,st.step+1));return}
 if(b.dataset.again!==undefined){go('step',0);return}
 if(b.dataset.reset!==undefined){st.checked.clear();go('cover');return}
});
app.addEventListener('change',e=>{
 const id=e.target.dataset&&e.target.dataset.id;if(!id)return;
 const row=e.target.closest('.it');
 if(e.target.checked){
  st.checked.add(id);if(row)row.classList.add('on');update();
  if(st.checked.size===TOTAL&&st.view==='step'){
   setTimeout(()=>{if(st.view==='step'&&st.checked.size===TOTAL)go('done')},600);
  }
 }else{st.checked.delete(id);if(row)row.classList.remove('on');update();}
});
render();
</script>
</body>
</html>
